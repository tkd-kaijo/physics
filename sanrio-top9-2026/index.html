<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff78a8">
  <meta name="description" content="2026年サンリオキャラクター大賞の上位50キャラクターから、あなたの好きなTOP9を決める非公式ファンゲームです。">
  <title>サンリオ好きキャラ9選メーカー</title>
  <style>
    :root { font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif; color: #493f61; background: #fff7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(150deg, #ffd5e7, #fff6d6 50%, #dff5ff); }
    .loader { width: min(430px, 100%); border-radius: 28px; padding: 32px 24px; background: rgba(255,255,255,.92); box-shadow: 0 12px 34px rgba(104,70,99,.14); text-align: center; }
    .mark { display: grid; place-items: center; width: 58px; aspect-ratio: 1; margin: 0 auto 18px; border-radius: 50%; background: #ff78a8; color: white; font-size: 2rem; font-weight: 900; }
    h1 { margin: 0; font-size: 1.35rem; }
    p { margin: 12px 0 0; color: #7d738d; line-height: 1.7; }
    .dots { margin-top: 20px; font-size: 1.5rem; letter-spacing: .22em; animation: pulse 1.1s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .25; } }
    button { margin-top: 18px; border: 0; border-radius: 999px; padding: 11px 18px; background: #ff78a8; color: white; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main class="loader" id="status" role="status" aria-live="polite">
    <div class="mark">9</div>
    <h1>サンリオ好きキャラ9選</h1>
    <p>アプリを読み込んでいます。</p>
    <div class="dots" aria-hidden="true">●●●</div>
  </main>
  <script>
    (async () => {
      if (!("DecompressionStream" in window)) throw new Error("このブラウザはアプリの展開機能に対応していません。");
      const files = ["package/bundle-1.txt", "package/bundle-2.txt", "package/bundle-3.txt"];
      const parts = await Promise.all(files.map(async path => {
        const response = await fetch(`${path}?v=20260922`, {cache: "no-store"});
        if (!response.ok) throw new Error(`アプリデータの読み込みに失敗しました（${response.status}）。`);
        return (await response.text()).trim();
      }));
      const encoded = parts.join("");
      const binary = atob(encoded);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      const status = document.querySelector("#status");
      status.innerHTML = `<div class="mark">!</div><h1>読み込めませんでした</h1><p>${String(error.message || error)}</p><button type="button" onclick="location.reload()">再読み込み</button>`;
      console.error(error);
    });
  </script>
</body>
</html>
