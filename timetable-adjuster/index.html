<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時間割調整アプリ ver2</title><link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b8fcf"><style>html,body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0}body{padding:32px;text-align:center}p{color:#666}</style></head><body><p>時間割調整アプリを読み込んでいます…</p><script>(async()=>{try{const names=['app0.txt','app1.txt','app2.txt','app3.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));let source=parts.join('');const patch=(before,after,label)=>{if(!source.includes(before))throw new Error(label+'の更新箇所が見つかりません');source=source.replace(before,after)};patch("if(first.teacher.name===second.teacher.name||first.time===second.time)return setMessage(cross.message,'異なる教員・異なる時限の授業コマを選んでください。',true);","if(first.teacher.name===second.teacher.name)return setMessage(cross.message,'異なる教員の授業コマを選んでください。',true);",'同一時限交換');patch("current=>conflictTeams(current).size===0&&current.pos[sourceTeam]===targetSlot","current=>conflictTeams(current).size===0&&current.pos[sourceTeam]===targetSlot&&teamsAt(request.teacher.name,request.sourceTime,current).length===0",'移動元空きコマ条件');const warningHelpers=`  function planWarnings(state){const warnings=[],beforeCounts=new Map(),afterCounts=new Map(),countByClassDay=(plan,target)=>{teams.forEach(team=>{const slot=slots[plan.pos[team.id]];team.members.forEach(name=>{const key=name+"\\t"+slot.classId+"\\t"+slot.day;target.set(key,(target.get(key)||0)+1)})})},maxRun=(name,day,plan)=>{let best=0,run=0;for(let period=1;period<=PERIODS[day];period+=1){const time=timeKey(day,period),busy=teamsAt(name,time,plan).length>0||(fixedBusy.get(name)?.has(time)||false);if(busy){run+=1;if(run>best)best=run}else run=0}return best};countByClassDay(currentState,beforeCounts);countByClassDay(state,afterCounts);afterCounts.forEach((after,key)=>{const before=beforeCounts.get(key)||0;if(after>=2&&after>before){const parts=key.split("\\t"),name=parts[0],classId=parts[1],day=parts[2];warnings.push(name+"先生の"+classId+"の授業が"+day+"曜日に"+after+"コマ入ります")}});teachers.forEach(teacher=>DAYS.forEach(day=>{const before=maxRun(teacher.name,day,currentState),after=maxRun(teacher.name,day,state);if(after>=5&&after>before)warnings.push(teacher.name+"先生の"+day+"曜日の時間割が"+after+"コマ連続になります")}));return warnings;}\n`;patch("  function render(result,{forced=[]",warningHelpers+"  function render(result,{forced=[]",'警告判定');patch("section.append(sequenceTable([...history,...forced,...state.steps]));const actions=document.createElement('div'),button=document.createElement('button');","section.append(sequenceTable([...history,...forced,...state.steps]));const warnings=forced.some(step=>step.kind==='指定譲渡')?[]:planWarnings(state);if(warnings.length){const box=document.createElement('div'),label=document.createElement('strong'),list=document.createElement('ul');box.style.cssText='margin-top:12px;padding:12px 14px;border:2px solid #d97706;border-radius:9px;background:color-mix(in srgb,#f59e0b 14%,Canvas);text-align:left';label.textContent='注意';list.style.margin='8px 0 0 1.2em';warnings.forEach(message=>{const item=document.createElement('li');item.textContent=message;list.append(item)});box.append(label,list);section.append(box)}const actions=document.createElement('div'),button=document.createElement('button');",'候補内警告表示');document.open();document.write(source);document.close()}catch(e){document.body.innerHTML='<h1>読み込みエラー</h1><p>'+String(e)+'</p>'}})();</script></body></html>
