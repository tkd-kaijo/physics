<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時間割調整アプリ ver2</title><link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b8fcf"><style>html,body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0}body{padding:32px;text-align:center}p{color:#666}</style></head><body><p>時間割調整アプリを読み込んでいます…</p><script>(async()=>{try{const names=['app0.txt','app1.txt','app2.txt','app3.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const before="if(first.teacher.name===second.teacher.name||first.time===second.time)return setMessage(cross.message,'異なる教員・異なる時限の授業コマを選んでください。',true);";const after="if(first.teacher.name===second.teacher.name)return setMessage(cross.message,'異なる教員の授業コマを選んでください。',true);";const source=parts.join('');if(!source.includes(before))throw new Error('更新パッチの適用対象が見つかりません');document.open();document.write(source.replace(before,after));document.close()}catch(e){document.body.innerHTML='<h1>読み込みエラー</h1><p>'+String(e)+'</p>'}})();</script></body></html>
