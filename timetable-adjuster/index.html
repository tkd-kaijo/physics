<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時間割調整アプリ ver2</title><link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#0b8fcf"><style>html,body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0}body{padding:32px;text-align:center}p{color:#666}</style></head><body><p>時間割調整アプリを読み込んでいます…</p><script>(async()=>{try{const names=['app0.txt','app1.txt','app2.txt','app3.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));let source=parts.join('');const patch=(before,after,label)=>{if(!source.includes(before))throw new Error(label+'の更新箇所が見つかりません');source=source.replace(before,after)};

const warningHelpers=`  function warningMetrics(plan){const classDayCounts=new Map(),runs=new Map();teams.forEach(team=>{const slot=slots[plan.pos[team.id]];team.members.forEach(name=>{const key=name+"\\t"+slot.classId+"\\t"+slot.day;classDayCounts.set(key,(classDayCounts.get(key)||0)+1)})});teachers.forEach(teacher=>DAYS.forEach(day=>{let best=0,run=0;for(let period=1;period<=PERIODS[day];period+=1){if(teamsAt(teacher.name,timeKey(day,period),plan).length>0){run+=1;if(run>best)best=run}else run=0}runs.set(teacher.name+"\\t"+day,best)}));return{classDayCounts,runs};}\n  function warningMessages(before,after){const warnings=[];after.classDayCounts.forEach((count,key)=>{const previous=before.classDayCounts.get(key)||0;if(count>=2&&count>previous){const parts=key.split("\\t");warnings.push(parts[0]+"先生の"+parts[1]+"の授業が"+parts[2]+"曜日に"+count+"コマ入ります")}});after.runs.forEach((count,key)=>{const previous=before.runs.get(key)||0;if(count>=5&&count>previous){const parts=key.split("\\t");warnings.push(parts[0]+"先生の"+parts[1]+"曜日の時間割が"+count+"コマ連続になります")}});return warnings;}\n  function planWarnings(state,beforeMetrics=null){return warningMessages(beforeMetrics||warningMetrics(currentState),warningMetrics(state));}\n`;
