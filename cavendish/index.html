<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>キャベンディッシュの実験</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;--bg:#0b1020;--card:#151c31;--text:#edf3ff;--muted:#9fb0cc;--line:#32415f;--a:#66a3ff;--b:#ffb35c;--g:#80d79b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0a1020,#11182b);color:var(--text);overscroll-behavior-y:contain}
main{max-width:1400px;margin:auto;padding:18px}
.top{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,36px);margin:0}
p{color:var(--muted);margin:.4rem 0}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.7fr);gap:16px;margin-top:14px}
.card{background:rgba(21,28,49,.94);border:1px solid var(--line);border-radius:18px;padding:14px}
.stage{position:relative;padding:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;background:radial-gradient(circle at 50% 20%,#1e2b4a,#0a1020 70%);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.overlay{position:absolute;left:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.draghint{position:absolute;left:10px;bottom:10px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(13,20,37,.82);color:#dce8ff;font-size:12px;pointer-events:none}
button,select,input{font:inherit}
button,select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#18233c;color:var(--text);padding:8px 12px}
button.primary{background:#2d6cdf;border-color:#4f83e8}
.viewbtn{min-width:46px;padding-left:10px;padding-right:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:#10182a;border:1px solid #263654;border-radius:12px;padding:10px}
.stat small{display:block;color:var(--muted)}
.stat b{display:block;margin-top:3px}
.controls{display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:6px}
.row label{display:flex;justify-content:space-between;color:#dce8ff;font-size:14px}
.row input[type=range]{width:100%;min-height:32px}
.switch{display:flex;align-items:center;gap:9px;color:#dce8ff;min-height:40px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.chart{width:100%;height:230px;display:block}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0d1425;padding:10px;border-radius:10px;color:#d9e8ff}
@media(max-width:1100px){
  .grid{grid-template-columns:1fr}
  .stage canvas{aspect-ratio:4/3}
  .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .controls .card:nth-child(3){grid-row:span 2}
}
@media(max-width:700px){
  main{padding:10px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .controls{display:flex}
  .card{border-radius:14px}
  .stage canvas{aspect-ratio:1/1}
  .draghint{font-size:11px}
}
@media(pointer:coarse){
  button,select{min-height:48px;font-size:16px}
  .viewbtn{min-width:50px}
  .overlay{gap:8px}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>キャベンディッシュの実験</h1>
      <p>大球の万有引力でねじり天秤が回転する様子を、力と角度の変化から観察できます。</p>
    </div>
    <div id="mode">G ×50（見やすく誇張）</div>
  </div>

  <div class="grid">
    <section>
      <div class="card stage">
        <canvas id="scene" width="960" height="720" aria-label="キャベンディッシュの実験の3Dシミュレーション"></canvas>
        <div class="overlay">
          <button id="front">正面</button>
          <button id="top">上から</button>
          <button class="viewbtn" id="left" aria-label="視点を左へ">←</button>
          <button class="viewbtn" id="right" aria-label="視点を右へ">→</button>
          <button class="viewbtn" id="up" aria-label="視点を上へ">↑</button>
          <button class="viewbtn" id="down" aria-label="視点を下へ">↓</button>
          <button class="viewbtn" id="zin" aria-label="拡大">＋</button>
          <button class="viewbtn" id="zout" aria-label="縮小">−</button>
        </div>
        <div class="draghint">1本指ドラッグ：視点回転　2本指：拡大・縮小</div>
      </div>

      <div class="stats">
        <div class="stat"><small>ねじれ角 θ</small><b id="theta">0.000°</b></div>
        <div class="stat"><small>万有引力 F</small><b id="force">—</b></div>
        <div class="stat"><small>重力トルク τg</small><b id="torque">—</b></div>
        <div class="stat"><small>平衡角</small><b id="eq">—</b></div>
      </div>

      <div class="card" style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;gap:10px"><b>ねじれ角の時間変化</b><span id="time">t = 0 s</span></div>
        <canvas id="chart" class="chart" width="900" height="230"></canvas>
      </div>
    </section>

    <aside class="controls">
      <div class="card">
        <div class="actions">
          <button class="primary" id="play">一時停止</button>
          <button id="reset">リセット</button>
          <button class="wide" id="swap">大球を反対側へ移動</button>
        </div>
      </div>

      <div class="card">
        <label class="switch"><input id="showForce" type="checkbox" checked> 万有引力ベクトル</label>
        <label class="switch"><input id="showTrail" type="checkbox" checked> 小球の軌跡</label>
      </div>

      <div class="card">
        <div class="row"><label>重力の表示倍率</label><select id="boost"><option value="1">実値 ×1</option><option value="10">×10</option><option value="50" selected>×50</option><option value="100">×100</option></select></div>
        <div class="row"><label><span>大球 M</span><span id="Mo"></span></label><input id="M" type="range" min="50" max="300" value="158"></div>
        <div class="row"><label><span>小球 m</span><span id="mo"></span></label><input id="m" type="range" min="0.2" max="2" step="0.01" value="0.73"></div>
        <div class="row"><label><span>棒の長さ L</span><span id="Lo"></span></label><input id="L" type="range" min="0.6" max="2.4" step="0.02" value="1.8"></div>
        <div class="row"><label><span>中心間距離 d</span><span id="do"></span></label><input id="d" type="range" min="0.15" max="0.65" step="0.01" value="0.35"></div>
        <div class="row"><label><span>ねじり定数 κ</span><span id="ko"></span></label><input id="k" type="range" min="20" max="250" value="120"></div>
        <div class="row"><label><span>減衰係数 b</span><span id="bo"></span></label><input id="b" type="range" min="0" max="20" step="0.2" value="4"></div>
        <div class="row"><label><span>時間倍率</span><span id="so"></span></label><input id="speed" type="range" min="5" max="180" step="5" value="80"></div>
      </div>

      <div class="card">
        <div class="formula">I θ¨ = τg − κθ − bθ˙</div>
        <p>静止した平衡状態では、おおむね τg = κθ。大球を反対側へ動かすと、ねじれの向きも反転します。</p>
      </div>
    </aside>
  </div>
</main>

<script>
(()=>{
const $=x=>document.getElementById(x),G0=6.67430e-11,sc=$('scene'),cx=sc.getContext('2d'),ch=$('chart'),gc=ch.getContext('2d');
let th=0,om=0,t=0,run=true,side=1,hist=[[0,0]],trail=[],yaw=-.9,pitch=.48,zoom=1,last=performance.now();
let pointers=new Map(),pinchDist=0;
const P=()=>({M:+$('M').value,m:+$('m').value,L:+$('L').value,d:+$('d').value,k:+$('k').value*1e-6,b:+$('b').value*1e-3,boost:+$('boost').value,speed:+$('speed').value});
function geo(a){let p=P(),r=p.L/2,c=Math.cos(a),s=Math.sin(a),z=.55;return{p,r,z,sm:[[r*c,r*s,z],[-r*c,-r*s,z]],lg:[[r,side*p.d,z],[-r,-side*p.d,z]]}}
function grav(a){let g=geo(a),tau=0,Fnear=0,min=1e9,fs=[[0,0,0],[0,0,0]];for(let i=0;i<2;i++)for(let j=0;j<2;j++){let dx=g.lg[j][0]-g.sm[i][0],dy=g.lg[j][1]-g.sm[i][1],dz=0,r=Math.max(.06,Math.hypot(dx,dy,dz)),f=G0*g.p.boost*g.p.M*g.p.m/r**2,nx=dx/r,ny=dy/r;fs[i][0]+=f*nx;fs[i][1]+=f*ny;if(r<min){min=r;Fnear=f}}for(let i=0;i<2;i++)tau+=g.sm[i][0]*fs[i][1]-g.sm[i][1]*fs[i][0];return{g,tau,Fnear,fs}}
function acc(a,w){let q=grav(a),I=2*q.g.p.m*q.g.r*q.g.r;return(q.tau-q.g.p.k*a-q.g.p.b*w)/I}
function step(dt){let a1=om,b1=acc(th,om),a2=om+b1*dt/2,b2=acc(th+a1*dt/2,om+b1*dt/2),a3=om+b2*dt/2,b3=acc(th+a2*dt/2,om+b2*dt/2),a4=om+b3*dt,b4=acc(th+a3*dt,om+b3*dt);th+=dt*(a1+2*a2+2*a3+a4)/6;om+=dt*(b1+2*b2+2*b3+b4)/6}
function equilibrium(){let p=P(),x=grav(0).tau/p.k;for(let i=0;i<12;i++){let h=1e-5,f=grav(x).tau-p.k*x,df=(grav(x+h).tau-grav(x-h).tau)/(2*h)-p.k;if(Math.abs(df)<1e-12)break;x-=f/df}return x}
function proj(pt){let w=sc.clientWidth,h=sc.clientHeight,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=pt[0],y=pt[1],z=pt[2]-.6,X=cy*x+sy*y,Y=-sp*(-sy*x+cy*y)+cp*z,Z=cp*(-sy*x+cy*y)+sp*z+4.2/zoom,f=Math.min(w,h)*1.15;return[w/2+f*X/Z,h/2-f*Y/Z,f/Z]}
function line(a,b,color,width=2,dash=[]){let A=proj(a),B=proj(b);cx.save();cx.strokeStyle=color;cx.lineWidth=width;cx.setLineDash(dash);cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();cx.restore()}
function ball(p,r,color,label){let q=proj(p),rr=Math.max(5,r*q[2]);cx.fillStyle=color;cx.strokeStyle='#cbd7ef';cx.lineWidth=1;cx.beginPath();cx.arc(q[0],q[1],rr,0,7);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.font='12px sans-serif';cx.textAlign='center';cx.fillText(label,q[0],q[1]-rr-7)}
function draw(){let w=sc.clientWidth,h=sc.clientHeight,d=devicePixelRatio||1;if(sc.width!==Math.round(w*d)||sc.height!==Math.round(h*d)){sc.width=Math.round(w*d);sc.height=Math.round(h*d);cx.setTransform(d,0,0,d,0,0)}cx.clearRect(0,0,w,h);let q=grav(th),g=q.g;for(let i=-4;i<=4;i++){line([i*.4,-1.8,0],[i*.4,1.8,0],'#273755',.7);line([-1.8,i*.4,0],[1.8,i*.4,0],'#273755',.7)}line([0,0,2.25],[0,0,g.z],'#ad8ef0',2,[5,5]);let springLabel=proj([0,0,(2.25+g.z)/2]);cx.fillStyle='#d9e8ff';cx.font='13px sans-serif';cx.textAlign='left';cx.fillText('ねじりバネ',springLabel[0]+8,springLabel[1]);line(g.sm[0],g.sm[1],'#e8f0ff',4);line([g.lg[0][0],g.lg[0][1],0],g.lg[0],'#7589ad',5);line([g.lg[1][0],g.lg[1][1],0],g.lg[1],'#7589ad',5);if($('showTrail').checked&&trail.length>1){cx.strokeStyle='#9f8cff';cx.beginPath();trail.forEach((p,i)=>{let q=proj(p);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])});cx.stroke()}ball(g.lg[0],.16,'#7fd897','大球 M');ball(g.lg[1],.16,'#7fd897','大球 M');ball(g.sm[0],.085,'#67a8ff','小球 m');ball(g.sm[1],.085,'#67a8ff','小球 m');if($('showForce').checked)for(let i=0;i<2;i++){let f=q.fs[i],n=Math.hypot(f[0],f[1])||1,end=[g.sm[i][0]+.35*f[0]/n,g.sm[i][1]+.35*f[1]/n,g.z];line(g.sm[i],end,'#ffb35c',2.5)}}
function chart(){let w=ch.clientWidth,h=ch.clientHeight,d=devicePixelRatio||1;if(ch.width!==Math.round(w*d)||ch.height!==Math.round(h*d)){ch.width=Math.round(w*d);ch.height=Math.round(h*d);gc.setTransform(d,0,0,d,0,0)}gc.clearRect(0,0,w,h);gc.fillStyle='#10182a';gc.fillRect(0,0,w,h);let eq=equilibrium()*180/Math.PI,vals=hist.map(x=>x[1]*180/Math.PI).concat(eq),mn=Math.min(-.2,...vals),mx=Math.max(.2,...vals),sp=Math.max(.4,mx-mn);mn-=sp*.15;mx+=sp*.15;let tmax=Math.max(60,t),tmin=Math.max(0,tmax-600),X=x=>48+(x-tmin)/(tmax-tmin)*(w-60),Y=y=>12+(mx-y)/(mx-mn)*(h-42);gc.strokeStyle='#293a59';for(let i=0;i<5;i++){let y=12+i*(h-42)/4;gc.beginPath();gc.moveTo(48,y);gc.lineTo(w-12,y);gc.stroke()}gc.setLineDash([5,4]);gc.strokeStyle='#7fd897';gc.beginPath();gc.moveTo(48,Y(eq));gc.lineTo(w-12,Y(eq));gc.stroke();gc.setLineDash([]);gc.strokeStyle='#67a8ff';gc.lineWidth=2;gc.beginPath();hist.filter(x=>x[0]>=tmin).forEach((p,i)=>{let x=X(p[0]),y=Y(p[1]*180/Math.PI);i?gc.lineTo(x,y):gc.moveTo(x,y)});gc.stroke()}
function sci(x){if(!x)return'0';let e=Math.floor(Math.log10(Math.abs(x)));return(x/10**e).toFixed(2)+'×10^'+e}
function ui(){let p=P(),q=grav(th),e=equilibrium();$('theta').textContent=(th*180/Math.PI).toFixed(3)+'°';$('force').textContent=sci(q.Fnear)+' N';$('torque').textContent=sci(q.tau)+' N·m';$('eq').textContent=(e*180/Math.PI).toFixed(3)+'°';$('time').textContent='t = '+Math.round(t)+' s';$('Mo').textContent=p.M.toFixed(0)+' kg';$('mo').textContent=p.m.toFixed(2)+' kg';$('Lo').textContent=p.L.toFixed(2)+' m';$('do').textContent=p.d.toFixed(2)+' m';$('ko').textContent=$('k').value+' µN·m/rad';$('bo').textContent=(+$('b').value).toFixed(1)+' mN·m·s/rad';$('so').textContent=p.speed+'×';$('mode').textContent=p.boost==1?'G 実値 ×1':'G ×'+p.boost+'（見やすく誇張）';$('play').textContent=run?'一時停止':'再生'}
function reset(){th=om=t=0;hist=[[0,0]];trail=[]}
$('play').onclick=()=>{run=!run;ui()};
$('reset').onclick=()=>reset();
$('swap').onclick=()=>side*=-1;
$('front').onclick=()=>{yaw=-Math.PI/2;pitch=.2;zoom=1};
$('top').onclick=()=>{yaw=-Math.PI/2;pitch=1.28;zoom=1};
$('left').onclick=()=>yaw-=.18;
$('right').onclick=()=>yaw+=.18;
$('up').onclick=()=>pitch=Math.min(1.32,pitch+.14);
$('down').onclick=()=>pitch=Math.max(-.05,pitch-.14);
$('zin').onclick=()=>zoom=Math.min(2.1,zoom*1.16);
$('zout').onclick=()=>zoom=Math.max(.5,zoom/1.16);

function distance2(){let a=[...pointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
sc.addEventListener('pointerdown',e=>{e.preventDefault();sc.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2)pinchDist=distance2()});
sc.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw-=(e.clientX-prev.x)*.012;pitch=Math.max(-.05,Math.min(1.32,pitch+(e.clientY-prev.y)*.009))}else if(pointers.size===2){let nd=distance2();if(pinchDist>0&&nd>0)zoom=Math.max(.5,Math.min(2.1,zoom*(nd/pinchDist)));pinchDist=nd}});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchDist=0}
sc.addEventListener('pointerup',endPointer);
sc.addEventListener('pointercancel',endPointer);
sc.addEventListener('lostpointercapture',endPointer);
sc.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.1,zoom*(e.deltaY<0?1.08:.92)))},{passive:false});
['M','m','L','d','k','b','speed','boost','showForce','showTrail'].forEach(id=>$(id).oninput=ui);
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(run){let a=dt*P().speed;while(a>0){let h=Math.min(1.5,a);step(h);t+=h;a-=h}let prev=hist[hist.length-1];if(!prev||t-prev[0]>2){hist.push([t,th]);if(hist.length>700)hist.shift();trail.push(geo(th).sm[0]);if(trail.length>220)trail.shift()}}ui();draw();chart();requestAnimationFrame(loop)}
ui();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
